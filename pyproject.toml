[project]
name = "sqlinsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yakzan", email = "yakzan@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "networkx>=3.6.1",
    "pyvis>=0.3.2",
    "sqlglot>=30.12.0",
]

[project.scripts]
sqlinsight = "sqlinsight:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
